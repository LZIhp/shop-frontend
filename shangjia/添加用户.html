<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商家员工管理 - 添加员工</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>

<body class="bg-gray-50 min-h-screen">
    <!-- 顶部导航栏 -->
    <header class="bg-white shadow-sm">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fa fa-shopping-bag text-blue-600 text-2xl"></i>
                <h1 class="text-xl font-bold text-gray-800">商家管理系统</h1>
            </div>
            <div class="flex items-center space-x-4">
                <span class="text-gray-600"><i class="fa fa-user-circle mr-1"></i> 商家账号</span>
                <button class="text-gray-500 hover:text-gray-700 transition-colors">
                    <i class="fa fa-cog"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- 主要内容区 -->
    <main class="container mx-auto px-4 py-8">
        <div class="max-w-2xl mx-auto">
            <!-- 页面标题 -->
            <div class="mb-8">
                <h2 class="text-2xl font-bold text-gray-800 mb-2">添加员工</h2>
                <p class="text-gray-500">填写员工信息，添加到您的店铺</p>
            </div>

            <!-- 表单卡片 -->
            <div class="bg-white rounded-xl shadow-md p-6 mb-6 transform transition-all duration-300 hover:shadow-lg">
                <!-- 员工信息表单 -->
                <form id="staffForm" class="space-y-6">
                    <div>
                        <label for="name" class="block text-sm font-medium text-gray-700 mb-1">员工姓名 <span
                                class="text-red-500">*</span></label>
                        <input type="text" id="name" name="name"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors"
                            placeholder="请输入员工姓名" required>
                        <p id="nameError" class="mt-1 text-xs text-red-500 hidden">请输入有效的员工姓名</p>
                    </div>

                    <div>
                        <label for="phone" class="block text-sm font-medium text-gray-700 mb-1">手机号码 <span
                                class="text-red-500">*</span></label>
                        <input type="tel" id="phone" name="phone"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors"
                            placeholder="请输入手机号码" required>
                        <p id="phoneError" class="mt-1 text-xs text-red-500 hidden">请输入有效的11位手机号码</p>
                    </div>

                    <div>
                        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">密码 <span
                                class="text-red-500">*</span></label>
                        <input type="password" id="password" name="password"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors"
                            placeholder="请设置密码" required>
                        <p id="passwordError" class="mt-1 text-xs text-red-500 hidden">密码长度不能少于6位</p>
                    </div>

                    <div>
                        <label for="passwordConfirm" class="block text-sm font-medium text-gray-700 mb-1">确认密码 <span
                                class="text-red-500">*</span></label>
                        <input type="password" id="passwordConfirm" name="passwordConfirm"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors"
                            placeholder="请再次输入密码" required>
                        <p id="passwordConfirmError" class="mt-1 text-xs text-red-500 hidden">两次输入的密码不一致</p>
                    </div>
                    <!-- 操作按钮 -->
                    <div class="pt-4 flex space-x-4">
                        <button type="button" id="cancelBtn"
                            class="px-6 py-2.5 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 transition-colors">
                            取消
                        </button>
                        <button type="submit" id="submitBtn"
                            class="px-6 py-2.5 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors flex items-center justify-center">
                            <i class="fa fa-plus-circle mr-2"></i>
                            <span>添加员工</span>
                        </button>
                    </div>
                </form>
            </div>

            <!-- 员工列表链接 -->
            <!-- <div class="text-center">
                <a href="#"
                    class="text-blue-600 hover:text-blue-800 flex items-center justify-center transition-colors">
                    <i class="fa fa-list-ul mr-1"></i>
                    <span>查看员工列表</span>
                </a>
            </div> -->
        </div>
    </main>

    <!-- 通知提示框 -->
    <div id="notification"
        class="fixed top-4 right-4 px-6 py-3 rounded-lg shadow-lg transform translate-x-full transition-all duration-500 flex items-center space-x-3 z-50">
        <i id="notificationIcon" class="fa fa-check-circle text-xl"></i>
        <span id="notificationMessage"></span>
        <button id="closeNotification" class="text-gray-300 hover:text-white transition-colors">
            <i class="fa fa-times"></i>
        </button>
    </div>

    <!-- 详细错误弹窗 -->
    <div id="errorModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-lg max-w-md w-full max-h-[80vh] overflow-auto m-4">
            <div class="p-4 border-b">
                <h3 class="font-bold text-lg text-red-500">请求错误详情</h3>
            </div>
            <div class="p-4">
                <p class="mb-2"><span class="font-medium">状态码:</span> <span id="errorStatusCode"></span></p>
                <p class="mb-2"><span class="font-medium">错误信息:</span></p>
                <pre id="errorDetails" class="bg-gray-50 p-3 rounded text-sm overflow-auto max-h-40"></pre>
            </div>
            <div class="p-4 border-t flex justify-end">
                <button id="closeErrorModal" class="px-4 py-2 bg-gray-200 rounded hover:bg-gray-300 transition-colors">
                    关闭
                </button>
            </div>
        </div>
    </div>

    <script type="module">
        import url1 from '../peizhi/config.js';
        // 店铺ID - 在代码中体现，不在页面显示
        const SHOP_ID = localStorage.getItem("current_shop_id")
        // API地址
        const API_URL = `${url1}/api/merchants/staffs/`;

        // 获取DOM元素
        const staffForm = document.getElementById('staffForm');
        const submitBtn = document.getElementById('submitBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        const showDebugBtn = document.getElementById('showDebugBtn');
        const debugInfo = document.getElementById('debugInfo');
        const debugUrl = document.getElementById('debugUrl');
        const debugData = document.getElementById('debugData');
        const debugTokenStatus = document.getElementById('debugTokenStatus');
        const notification = document.getElementById('notification');
        const notificationIcon = document.getElementById('notificationIcon');
        const notificationMessage = document.getElementById('notificationMessage');
        const closeNotification = document.getElementById('closeNotification');
        const nameInput = document.getElementById('name');
        const phoneInput = document.getElementById('phone');
        const passwordInput = document.getElementById('password');
        const passwordConfirmInput = document.getElementById('passwordConfirm');
        const nameError = document.getElementById('nameError');
        const phoneError = document.getElementById('phoneError');
        const passwordError = document.getElementById('passwordError');
        const passwordConfirmError = document.getElementById('passwordConfirmError');
        const errorModal = document.getElementById('errorModal');
        const errorStatusCode = document.getElementById('errorStatusCode');
        const errorDetails = document.getElementById('errorDetails');
        const closeErrorModal = document.getElementById('closeErrorModal');

        // 从localStorage获取token
        function getAuthToken() {
            return localStorage.getItem("sjlocaltoken");
        }

        // 输入验证
        function validateForm() {
            let isValid = true;
            const name = nameInput.value.trim();
            const phone = phoneInput.value.trim();
            const password = passwordInput.value;
            const passwordConfirm = passwordConfirmInput.value;

            // 验证姓名
            if (!name || name.length < 2) {
                nameError.classList.remove('hidden');
                nameInput.classList.add('border-red-500');
                isValid = false;
            } else {
                nameError.classList.add('hidden');
                nameInput.classList.remove('border-red-500');
            }

            // 验证手机号
            const phoneRegex = /^1[3-9]\d{9}$/;
            if (!phoneRegex.test(phone)) {
                phoneError.classList.remove('hidden');
                phoneInput.classList.add('border-red-500');
                isValid = false;
            } else {
                phoneError.classList.add('hidden');
                phoneInput.classList.remove('border-red-500');
            }

            // 验证密码
            if (!password || password.length < 6) {
                passwordError.classList.remove('hidden');
                passwordInput.classList.add('border-red-500');
                isValid = false;
            } else {
                passwordError.classList.add('hidden');
                passwordInput.classList.remove('border-red-500');
            }

            // 验证确认密码
            if (password !== passwordConfirm) {
                passwordConfirmError.classList.remove('hidden');
                passwordConfirmInput.classList.add('border-red-500');
                isValid = false;
            } else {
                passwordConfirmError.classList.add('hidden');
                passwordConfirmInput.classList.remove('border-red-500');
            }

            // 更新调试信息
            updateDebugInfo();

            return isValid;
        }

        // 更新调试信息
        function updateDebugInfo() {
            const formData = {
                name: nameInput.value.trim(),
                phone_number: phoneInput.value.trim(),
                password: passwordInput.value ? '******' : '',
                password_confirm: passwordConfirmInput.value ? '******' : '',
                shop: SHOP_ID
            };

            debugUrl.textContent = API_URL;
            debugData.textContent = JSON.stringify(formData, null, 2);
            debugTokenStatus.textContent = getAuthToken() ? "已找到" : "未找到";
        }

        // 输入框实时验证
        nameInput.addEventListener('input', validateForm);
        phoneInput.addEventListener('input', validateForm);
        passwordInput.addEventListener('input', validateForm);
        passwordConfirmInput.addEventListener('input', validateForm);

        // 显示/隐藏调试信息
        showDebugBtn.addEventListener('click', () => {
            debugInfo.classList.toggle('hidden');
            updateDebugInfo();
        });

        // 表单提交事件
        staffForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            // 表单验证
            if (!validateForm()) {
                showNotification('请修正表单中的错误后重试', 'error');
                return;
            }

            // 从localStorage获取认证令牌
            const authToken = getAuthToken();
            if (!authToken) {
                showNotification('未找到认证信息，请先登录', 'error');
                return;
            }

            // 准备请求数据
            const formData = {
                name: nameInput.value.trim(),
                phone_number: phoneInput.value.trim(),
                password: passwordInput.value,
                password_confirm: passwordConfirmInput.value,
                shop: SHOP_ID
            };

            // 禁用提交按钮，显示加载状态
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa fa-spinner fa-spin mr-2"></i><span>处理中...</span>';
            submitBtn.classList.remove('bg-blue-600', 'hover:bg-blue-700');
            submitBtn.classList.add('bg-blue-400', 'cursor-not-allowed');

            try {
                // 发送POST请求
                const response = await axios.post(
                    API_URL,
                    formData,
                    {
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${authToken}`
                        }
                    }
                );

                // 显示成功消息
                showNotification('员工添加成功！', 'success');

                // 重置表单
                staffForm.reset();
                updateDebugInfo();

                console.log('添加成功:', response.data);
            } catch (error) {
                // 处理错误
                console.error('添加失败:', error);

                // 提取错误信息
                let errorMsg = '添加失败，请查看详细错误信息';
                let statusCode = error.response?.status || '未知';
                let errorDetailsText = '';

                if (error.response && error.response.data) {
                    errorDetailsText = JSON.stringify(error.response.data, null, 2);

                    // 400错误处理
                    if (error.response.status === 400) {
                        showErrorModal(statusCode, errorDetailsText);
                    } else if (error.response.status === 401) {
                        errorMsg = '认证失败，请重新登录';
                    }
                } else if (error.message) {
                    errorMsg = error.message;
                    errorDetailsText = error.stack || error.message;
                }

                showNotification(errorMsg, 'error');
            } finally {
                // 恢复按钮状态
                setTimeout(() => {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fa fa-plus-circle mr-2"></i><span>添加员工</span>';
                    submitBtn.classList.remove('bg-blue-400', 'cursor-not-allowed');
                    submitBtn.classList.add('bg-blue-600', 'hover:bg-blue-700');
                }, 800);
            }
        });

        // 显示错误详情弹窗
        function showErrorModal(statusCode, details) {
            errorStatusCode.textContent = statusCode;
            errorDetails.textContent = details;
            errorModal.classList.remove('hidden');
        }

        // 关闭错误弹窗
        closeErrorModal.addEventListener('click', () => {
            errorModal.classList.add('hidden');
        });

        // 取消按钮事件
        cancelBtn.addEventListener('click', () => {
            if (confirm('确定要取消添加员工吗？已填写的信息将被清空。')) {
                staffForm.reset();
                // 清除错误提示
                nameError.classList.add('hidden');
                phoneError.classList.add('hidden');
                passwordError.classList.add('hidden');
                passwordConfirmError.classList.add('hidden');
                nameInput.classList.remove('border-red-500');
                phoneInput.classList.remove('border-red-500');
                passwordInput.classList.remove('border-red-500');
                passwordConfirmInput.classList.remove('border-red-500');
                updateDebugInfo();
            }
        });

        // 关闭通知
        closeNotification.addEventListener('click', () => {
            notification.style.transform = 'translateX(calc(100% + 20px))';
        });

        // 显示通知消息
        function showNotification(message, type = 'info') {
            notificationMessage.textContent = message;

            // 设置通知类型样式
            if (type === 'success') {
                notification.className = 'fixed top-4 right-4 px-6 py-3 bg-green-500 text-white rounded-lg shadow-lg transform translate-x-0 transition-all duration-500 flex items-center space-x-3 z-50';
                notificationIcon.className = 'fa fa-check-circle text-xl';
            } else if (type === 'error') {
                notification.className = 'fixed top-4 right-4 px-6 py-3 bg-red-500 text-white rounded-lg shadow-lg transform translate-x-0 transition-all duration-500 flex items-center space-x-3 z-50 max-w-xs';
                notificationIcon.className = 'fa fa-exclamation-circle text-xl';
            } else {
                notification.className = 'fixed top-4 right-4 px-6 py-3 bg-blue-500 text-white rounded-lg shadow-lg transform translate-x-0 transition-all duration-500 flex items-center space-x-3 z-50';
                notificationIcon.className = 'fa fa-info-circle text-xl';
            }

            // 错误信息保留时间更长
            setTimeout(() => {
                notification.style.transform = 'translateX(calc(100% + 20px))';
            }, type === 'error' ? 10000 : 5000);
        }

        // 页面加载时初始化
        window.addEventListener('load', () => {
            updateDebugInfo();
            if (!getAuthToken()) {
                showNotification('检测到您尚未登录，部分功能可能受限', 'info');
            }
        });
    </script>
</body>

</html>
