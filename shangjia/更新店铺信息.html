<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <!-- 必须的 meta 标签 -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

    <!-- Bootstrap 的 CSS 文件 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css" />
    <title>华耀城管理系统</title>
    <style>
        /* 基础样式 */
        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
            background-color: #f8f9fa;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            overflow: hidden;
            /* 防止页面整体滚动 */
        }

        /* 侧边栏样式 */
        .sidebar {
            background-color: #0d033b;
            color: white;
            height: 100vh;
            padding-top: 2rem;
            transition: all 0.3s ease;
            position: fixed;
            /* 固定侧边栏 */
            left: 0;
            top: 0;
            z-index: 10;
            width: 250px;
            /* 固定宽度 */
        }

        /* 店铺标题样式 */
        .sidebar .shop-title {
            font-size: 1.5rem;
            font-weight: bold;
            padding: 0 1rem 1.5rem;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            color: rgb(14, 14, 13);
        }

        .sidebar .shop-title i {
            margin-right: 0.5rem;
            font-size: 1.8rem;
        }

        /* 导航项样式 */
        .sidebar .nav-item {
            padding: 0.75rem 1.5rem;
            margin-bottom: 0.25rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
        }

        .sidebar .nav-item i {
            width: 24px;
            margin-right: 0.75rem;
            text-align: center;
        }

        .sidebar .nav-item:hover,
        .sidebar .nav-item.active {
            background-color: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        /* iframe容器样式 */
        .main-iframe-container {
            margin-left: 250px;
            /* 与侧边栏宽度一致 */
            width: calc(100% - 250px);
            /* 计算剩余宽度 */
            height: 100vh;
            /* 占满整个视口高度 */
        }

        /* iframe样式 */
        #mainContentIframe {
            width: 100%;
            height: 100%;
            border: none;
            /* 去除边框 */
            display: block;
            /* 去除底部间隙 */
        }

        /* 移动端适配 */
        @media (max-width: 991.98px) {
            .sidebar {
                transform: translateX(-100%);
                /* 默认隐藏 */
                z-index: 100;
            }

            .sidebar.show {
                transform: translateX(0);
                /* 显示侧边栏 */
            }

            .main-iframe-container {
                margin-left: 0;
                width: 100%;
            }

            /* 移动端菜单按钮 */
            .mobile-menu-btn {
                position: fixed;
                top: 10px;
                left: 10px;
                z-index: 90;
                background-color: #ee1887;
                color: white;
                border: none;
                width: 40px;
                height: 40px;
                border-radius: 5px;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            /* 遮罩层 */
            .overlay {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background-color: rgba(0, 0, 0, 0.5);
                z-index: 80;
                display: none;
            }

            .overlay.show {
                display: block;
            }
        }
    </style>
</head>

<body>
    <!-- 移动端菜单按钮 -->
    <button class="mobile-menu-btn d-lg-none" id="mobileMenuBtn">
        <i class="fa fa-bars"></i>
    </button>

    <!-- 遮罩层 -->
    <div class="overlay" id="overlay"></div>

    <!-- 左侧导航栏 - 固定显示 -->
    <div class="col-lg-2 col-xs-12 sidebar" id="sidebar">
        <div class="text-center shop-title">hAdmin</div>
        <!-- 导航项链接到对应页面，target指向iframe名称 -->
        <a href="./添加用户.html" class="nav-item d-block" target="mainContentIframe">
            <i class="fa fa-bell"></i>
            员工管理
        </a>
        <a href="./添加商品.html" class="nav-item d-block" target="mainContentIframe">
            <i class="fa fa-plus mr-2"></i>
            商品管理
        </a>
        <a href="./展示商品.html" class="nav-item d-block" target="mainContentIframe">
            <i class="fa fa-plus mr-2"></i>
            展示商品
        </a>
        <a href="./删除商品.html" class="nav-item d-block" target="mainContentIframe">
            <i class="fa fa-plus mr-2"></i>
            删除商品
        </a>

    </div>

    <!-- 主内容区域 - 使用iframe加载内容页面 -->
    <div class="main-iframe-container">
        <iframe id="mainContentIframe" name="mainContentIframe" src="./展示商品.html"></iframe>
    </div>

    <!-- JavaScript 文件 -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"
        integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-7ymO4nGrkm372HoSbq1OY2DP4pEZnMiA+E0F3zPr+JQQtQ82gQ1HPY3QIVtztVua"
        crossorigin="anonymous"></script>
    <script>
        console.log(localStorage.getItem('current_shop_id'));

        // 获取DOM元素
        const sidebar = document.getElementById("sidebar");
        const mobileMenuBtn = document.getElementById("mobileMenuBtn");
        const overlay = document.getElementById("overlay");
        const navItems = document.querySelectorAll(".nav-item");
        const mainIframe = document.getElementById("mainContentIframe");

        // 移动端切换侧边栏显示/隐藏
        function toggleSidebar() {
            sidebar.classList.toggle("show");
            overlay.classList.toggle("show");
        }

        // 移动端菜单按钮点击事件
        mobileMenuBtn.addEventListener("click", toggleSidebar);

        // 点击遮罩层关闭侧边栏
        overlay.addEventListener("click", toggleSidebar);

        // 监听iframe加载完成，更新当前激活的导航项
        mainIframe.addEventListener("load", function () {
            // 获取当前iframe加载的页面URL
            const currentUrl = mainIframe.contentWindow.location.href;

            // 更新导航项激活状态
            navItems.forEach((item) => {
                const href = item.getAttribute("href");
                // 检查当前URL是否包含导航项的href
                if (currentUrl.includes(href)) {
                    item.classList.add("active");
                } else {
                    item.classList.remove("active");
                }
            });
        });

    </script>
</body>

</html>
