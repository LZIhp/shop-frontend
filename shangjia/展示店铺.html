<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>所有店铺列表 - 管理系统</title>
    <!-- 引入Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <style>
        /* 基础样式重置与全局设置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        :root {
            --primary: #165DFF;
            --primary-light: rgba(22, 93, 255, 0.9);
            --primary-hover: rgba(22, 93, 255, 0.3);
            --success: #00B42A;
            --warning: #FF7D00;
            --danger: #F53F3F;
            --gray-50: #F9FAFB;
            --gray-100: #F3F4F6;
            --gray-200: #E5E7EB;
            --gray-400: #9CA3AF;
            --gray-500: #6B7280;
            --gray-600: #4B5563;
            --gray-700: #374151;
            --gray-800: #1F2937;
            --gray-900: #111827;
            --white: #FFFFFF;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --radius: 0.5rem;
            --transition: all 0.3s ease;
        }

        body {
            background-color: var(--gray-50);
            color: var(--gray-800);
            min-height: 100vh;
            line-height: 1.5;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem;
        }

        /* 工具类 */
        .card-hover {
            transition: var(--transition);
        }

        .card-hover:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-4px);
            cursor: pointer;
        }

        .text-sm {
            font-size: 0.875rem;
        }

        .text-lg {
            font-size: 1.125rem;
        }

        .font-semibold {
            font-weight: 600;
        }

        .font-medium {
            font-weight: 500;
        }

        .rounded {
            border-radius: var(--radius);
        }

        .shadow-sm {
            box-shadow: var(--shadow-sm);
        }

        .truncate {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .max-w-200 {
            max-width: 200px;
        }

        .text-right {
            text-align: right;
        }

        /* 顶部导航 */
        header {
            background-color: var(--white);
            box-shadow: var(--shadow-sm);
            position: sticky;
            top: 0;
            z-index: 30;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 1rem;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .logo i {
            color: var(--primary);
            font-size: 1.5rem;
        }

        .logo h1 {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .user-menu span {
            color: var(--gray-600);
            display: none;
        }

        @media (min-width: 768px) {
            .user-menu span {
                display: inline-block;
            }
        }

        .btn {
            padding: 0.375rem 0.75rem;
            border-radius: var(--radius);
            font-size: 0.875rem;
            transition: var(--transition);
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.25rem;
        }

        .btn-outline-gray {
            background-color: var(--gray-100);
            color: var(--gray-800);
        }

        .btn-outline-gray:hover {
            background-color: var(--gray-200);
        }

        .btn-primary {
            background-color: var(--primary);
            color: var(--white);
        }

        .btn-primary:hover {
            background-color: var(--primary-light);
        }

        /* 主内容区 */
        main {
            padding: 1.5rem 0;
        }

        /* 店铺列表 */
        .shop-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
        }

        @media (min-width: 1024px) {
            .shop-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .shop-card {
            background-color: var(--white);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
        }

        .shop-image {
            height: 12rem;
            background-color: var(--gray-100);
            position: relative;
        }

        .shop-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .shop-status {
            position: absolute;
            top: 0.75rem;
            right: 0.75rem;
            padding: 0.25rem 0.5rem;
            font-size: 0.75rem;
            font-weight: 600;
            border-radius: 9999px;
        }

        .status-approved {
            background-color: rgba(0, 180, 42, 0.1);
            color: #007020;
        }

        .status-pending {
            background-color: rgba(255, 125, 0, 0.1);
            color: #9A4C00;
        }

        .status-rejected {
            background-color: rgba(245, 63, 63, 0.1);
            color: #9A2020;
        }

        .status-suspended {
            background-color: rgba(255, 125, 0, 0.1);
            color: #9A4C00;
        }

        .status-unknown {
            background-color: rgba(107, 114, 128, 0.1);
            color: #4B5563;
        }

        .shop-content {
            padding: 1.25rem;
        }

        .shop-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.5rem;
        }

        .shop-name {
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--gray-900);
        }

        .shop-id {
            font-size: 0.75rem;
            color: var(--gray-500);
        }

        .shop-desc {
            font-size: 0.875rem;
            color: var(--gray-500);
            margin-bottom: 1rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .shop-info {
            margin-bottom: 1.25rem;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.875rem;
            margin-bottom: 0.5rem;
        }

        .info-label {
            color: var(--gray-500);
        }

        .info-value {
            color: var(--gray-700);
        }

        .btn-view-detail {
            width: 100%;
            padding: 0.5rem;
            font-size: 0.875rem;
            gap: 0.25rem;
        }

        /* 加载状态和空状态 */
        .empty-state {
            padding: 4rem 0;
            text-align: center;
            color: var(--gray-500);
            grid-column: 1 / -1;
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 1rem;
            display: block;
        }

        .empty-state p {
            font-size: 1.125rem;
        }

        .loading-state i {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        /* 分页 */
        .pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 2rem;
            font-size: 0.875rem;
            color: var(--gray-500);
            flex-wrap: wrap;
            gap: 1rem;
        }

        .pagination-info {
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .pagination-info .font-medium {
            font-weight: 500;
            color: var(--gray-800);
        }

        .pagination-controls {
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .page-btn {
            width: 2rem;
            height: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius);
            border: 1px solid var(--gray-200);
            background-color: var(--white);
            color: var(--gray-500);
            font-size: 0.75rem;
            transition: var(--transition);
            cursor: pointer;
        }

        .page-btn:hover:not(:disabled) {
            background-color: var(--gray-50);
        }

        .page-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .page-btn.active {
            border-color: var(--primary);
            background-color: var(--primary);
            color: var(--white);
        }

        .ellipsis {
            width: 2rem;
            height: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gray-500);
            font-size: 0.75rem;
        }

        /* 页脚 */
        footer {
            background-color: var(--white);
            border-top: 1px solid var(--gray-200);
            margin-top: 2rem;
            padding: 1rem 0;
        }

        .footer-content {
            text-align: center;
            font-size: 0.75rem;
            color: var(--gray-500);
        }
    </style>
</head>

<body>
    <!-- 顶部导航 -->
    <header>
        <div class="container header-content">
            <div class="logo">
                <i class="fa fa-building"></i>
                <h1>管理选择您的店铺</h1>
            </div>
            <div class="user-menu">
                <span class="hidden md:inline-block">管理员</span>
                <button class="btn btn-outline-gray">
                    <i class="fa fa-sign-out"></i>退出
                </button>
            </div>
        </div>
    </header>

    <!-- 主内容区 -->
    <main class="container">
        <!-- 店铺列表 -->
        <div class="shop-grid" id="shopListContainer">
            <div class="empty-state loading-state">
                <i class="fa fa-spinner"></i>
                <p>正在加载店铺数据...</p>
            </div>
        </div>

        <!-- 分页 -->
        <div class="pagination">
            <div class="pagination-info" id="paginationInfo">
                显示 <span class="font-medium">0</span> 到 <span class="font-medium">0</span> 条，共 <span
                    class="font-medium">0</span> 条记录
            </div>
            <div class="pagination-controls" id="paginationControls">
                <button class="page-btn" id="prevPage" disabled>
                    <i class="fa fa-chevron-left"></i>
                </button>
                <!-- 页码通过JS渲染 -->
                <button class="page-btn active">1</button>
                <button class="page-btn" id="nextPage" disabled>
                    <i class="fa fa-chevron-right"></i>
                </button>
            </div>
        </div>
    </main>

    <!-- 页脚 -->
    <footer>
        <div class="container footer-content">
            © 2025 店铺管理系统 - 管理员端
        </div>
    </footer>

    <script type="module">
        import url1 from '../peizhi/config.js';

        // 分页配置（后端分页）
        const paginationConfig = {
            pageSize: 10, // 每页条数（需和后端约定）
            currentPage: 1,
            totalCount: 0, // 总数据条数（后端返回count）
            totalPages: 0  // 总页数（计算得出）
        };

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function () {
            console.log(localStorage.getItem("sjlocaltoken"));

            // 首次加载第一页数据
            fetchShopData(paginationConfig.currentPage);

            // 绑定分页事件
            document.getElementById('prevPage').addEventListener('click', goToPrevPage);
            document.getElementById('nextPage').addEventListener('click', goToNextPage);
        });

        /**
         * 请求店铺数据（带分页）
         * @param {number} page - 页码
         */
        function fetchShopData(page) {
            // 显示加载状态
            const container = document.getElementById('shopListContainer');
            container.innerHTML = `
                <div class="empty-state loading-state">
                    <i class="fa fa-spinner"></i>
                    <p>正在加载店铺数据...</p>
                </div>
            `;

            // 拼接请求参数（仅分页）
            const requestUrl = `${url1}/api/shops/?page=${page}&page_size=${paginationConfig.pageSize}`;

            // 请求后端数据
            axios({
                url: requestUrl,
                method: 'get',
                headers: {
                    'Content-Type': 'application/json',
                    Authorization: `Bearer ${localStorage.getItem("sjlocaltoken")}`
                }
            }).then(result => {
                console.log('接口返回数据：', result);

                // 更新分页配置
                paginationConfig.totalCount = result.data.count; // 后端返回的总条数
                paginationConfig.totalPages = Math.ceil(paginationConfig.totalCount / paginationConfig.pageSize);
                paginationConfig.currentPage = page;

                // 渲染店铺列表
                renderShopList(result.data.results);

                // 渲染分页控件
                renderPaginationControls();

                // 更新分页信息
                updatePaginationInfo();
            }).catch(error => {
                console.error('店铺数据请求失败：', error);
                const container = document.getElementById('shopListContainer');
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fa fa-exclamation-circle" style="color: var(--danger);"></i>
                        <p class="text-lg">店铺数据加载失败，请刷新页面重试</p>
                    </div>
                `;
            });
        }

        /**
         * 渲染店铺列表
         * @param {Array} shopList - 店铺数据数组
         */
        function renderShopList(shopList) {
            const container = document.getElementById('shopListContainer');
            container.innerHTML = '';

            // 空数据处理
            if (!shopList || shopList.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fa fa-building-o"></i>
                        <p class="text-lg">暂无店铺数据</p>
                    </div>
                `;
                return;
            }

            // 渲染店铺卡片
            shopList.forEach(shop => {
                // 状态样式和文本
                let statusClass = '';
                let statusText = '';
                switch (shop.status) {
                    case 'approved':
                        statusClass = 'status-approved';
                        statusText = '已通过';
                        break;
                    case 'pending':
                        statusClass = 'status-pending';
                        statusText = '待审核';
                        break;
                    case 'rejected':
                        statusClass = 'status-rejected';
                        statusText = '已拒绝';
                        break;
                    case 'suspended':
                        statusClass = 'status-suspended';
                        statusText = '已暂停';
                        break;
                    default:
                        statusClass = 'status-unknown';
                        statusText = '未知状态';
                }

                // 格式化创建时间
                const createTime = shop.created_at ? new Date(shop.created_at).toLocaleDateString('zh-CN') : '未知时间';

                // 创建店铺卡片
                const shopCard = document.createElement('div');
                shopCard.className = 'shop-card card-hover';
                shopCard.dataset.shopId = shop.shop_id;

                // 卡片点击事件
                shopCard.addEventListener('click', function () {
                    localStorage.setItem('current_shop_id', this.dataset.shopId);
                    window.location.href = './更新店铺信息.html';
                });

                // 卡片内容
                shopCard.innerHTML = `
                    <div class="shop-image">
                        <img src="${url1}${shop.photo_url}" alt="${shop.name}外观图">
                        <span class="shop-status ${statusClass}">${statusText}</span>
                    </div>
                    <div class="shop-content">
                        <div class="shop-header">
                            <h3 class="shop-name">${shop.name}</h3>
                            <span class="shop-id">ID: ${shop.shop_id}</span>
                        </div>
                        <p class="shop-desc">暂无店铺描述</p>
                        <div class="shop-info">
                            <div class="info-row">
                                <span class="info-label">所属商家:</span>
                                <span class="info-value">${shop.merchant_name || '未知商家'}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">地址:</span>
                                <span class="info-value truncate max-w-200 text-right">${shop.address}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">联系电话:</span>
                                <span class="info-value">${shop.phone_number}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">商品数量:</span>
                                <span class="info-value">0 件</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">创建时间:</span>
                                <span class="info-value">${createTime}</span>
                            </div>
                        </div>
                        <div>
                            <button class="btn btn-primary btn-view-detail" data-shop-id="${shop.shop_id}">
                                <i class="fa fa-eye"></i>查看店铺详情
                            </button>
                        </div>
                    </div>
                `;

                container.appendChild(shopCard);
            });

            // 绑定查看详情按钮事件（阻止冒泡）
            document.querySelectorAll('.btn-view-detail').forEach(button => {
                button.addEventListener('click', function (e) {
                    e.stopPropagation();
                    const currentShopId = this.dataset.shopId;
                    localStorage.setItem('current_shop_id', currentShopId);
                    window.location.href = './更新店铺信息.html';
                });
            });
        }

        /**
         * 渲染分页控件
         */
        function renderPaginationControls() {
            const controlsContainer = document.getElementById('paginationControls');
            const prevBtn = document.getElementById('prevPage');
            const nextBtn = document.getElementById('nextPage');

            // 清空现有页码（保留前后按钮）
            while (controlsContainer.children.length > 2) {
                controlsContainer.removeChild(controlsContainer.children[1]);
            }

            const totalPages = paginationConfig.totalPages;
            const currentPage = paginationConfig.currentPage;

            // 页码显示规则
            let pageNumbers = [];
            if (totalPages <= 5) {
                // 总页数≤5：显示所有页码
                for (let i = 1; i <= totalPages; i++) {
                    pageNumbers.push(i);
                }
            } else {
                // 总页数>5：显示当前页前后2页 + 首尾页 + 省略号
                pageNumbers.push(1);
                if (currentPage > 3) pageNumbers.push('...');
                if (currentPage > 2) pageNumbers.push(currentPage - 2);
                if (currentPage > 1) pageNumbers.push(currentPage - 1);
                if (currentPage !== 1 && currentPage !== totalPages) pageNumbers.push(currentPage);
                if (currentPage < totalPages) pageNumbers.push(currentPage + 1);
                if (currentPage < totalPages - 1) pageNumbers.push(currentPage + 2);
                if (currentPage < totalPages - 2) pageNumbers.push('...');
                if (totalPages > 1) pageNumbers.push(totalPages);
            }

            // 添加页码按钮
            pageNumbers.forEach(item => {
                if (item === '...') {
                    const ellipsis = document.createElement('span');
                    ellipsis.className = 'ellipsis';
                    ellipsis.textContent = '...';
                    controlsContainer.insertBefore(ellipsis, nextBtn);
                } else {
                    const pageBtn = document.createElement('button');
                    pageBtn.className = `page-btn ${item === currentPage ? 'active' : ''}`;
                    pageBtn.textContent = item;
                    pageBtn.dataset.page = item;
                    pageBtn.addEventListener('click', () => goToPage(item));
                    controlsContainer.insertBefore(pageBtn, nextBtn);
                }
            });

            // 更新上下页按钮状态
            prevBtn.disabled = currentPage === 1;
            nextBtn.disabled = currentPage === totalPages;
        }

        /**
         * 更新分页信息文本
         */
        function updatePaginationInfo() {
            const total = paginationConfig.totalCount;
            const current = paginationConfig.currentPage;
            const size = paginationConfig.pageSize;

            const start = total > 0 ? (current - 1) * size + 1 : 0;
            const end = Math.min(current * size, total);

            document.getElementById('paginationInfo').innerHTML = `
                显示 <span class="font-medium">${start}</span> 到 <span class="font-medium">${end}</span> 条，共 <span class="font-medium">${total}</span> 条记录
            `;
        }

        /**
         * 跳转到指定页码
         * @param {number} pageNum - 目标页码
         */
        function goToPage(pageNum) {
            if (pageNum < 1 || pageNum > paginationConfig.totalPages || pageNum === paginationConfig.currentPage) {
                return;
            }
            fetchShopData(pageNum); // 重新请求目标页数据
            window.scrollTo({ top: 0, behavior: 'smooth' }); // 滚动到顶部
        }

        /**
         * 上一页
         */
        function goToPrevPage() {
            goToPage(paginationConfig.currentPage - 1);
        }

        /**
         * 下一页
         */
        function goToNextPage() {
            goToPage(paginationConfig.currentPage + 1);
        }
    </script>
</body>

</html>
