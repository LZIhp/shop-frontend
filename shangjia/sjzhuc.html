<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>华耀城商家注册</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }

        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4edf5 100%);
        }

        .container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }

        .form {
            display: flex;
            flex-direction: column;
            gap: 20px;
            background-color: #fff;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .form:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);
        }

        .logo {
            text-align: center;
            margin-bottom: 10px;
        }

        .logo-text {
            font-size: 28px;
            font-weight: 700;
            color: #2c3e50;
            letter-spacing: 1px;
        }

        .logo-subtext {
            font-size: 14px;
            color: #7f8c8d;
            margin-top: 5px;
        }

        .title {
            font-size: 24px;
            color: #3498db;
            font-weight: 600;
            text-align: center;
            margin-bottom: 5px;
            position: relative;
            padding-bottom: 10px;
        }

        .title::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 3px;
            background: linear-gradient(to right, #3498db, #2ecc71);
            border-radius: 2px;
        }

        .message {
            color: #7f8c8d;
            font-size: 14px;
            text-align: center;
            line-height: 1.5;
            margin-bottom: 10px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .input-container {
            position: relative;
            margin-bottom: 5px;
        }

        .input-container label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #2c3e50;
            font-size: 14px;
        }

        .input {
            width: 100%;
            padding: 14px 16px;
            outline: none;
            border: 1.5px solid #e1e8ed;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s ease;
            background-color: #fafbfc;
        }

        .input:focus {
            border-color: #3498db;
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
        }

        .input-error {
            border-color: #e74c3c;
        }

        .error-message {
            color: #e74c3c;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }

        .password-strength {
            height: 4px;
            border-radius: 2px;
            margin-top: 8px;
            background-color: #ecf0f1;
            overflow: hidden;
        }

        .strength-bar {
            height: 100%;
            width: 0%;
            transition: width 0.3s ease, background-color 0.3s ease;
        }

        .strength-weak {
            background-color: #e74c3c;
            width: 33%;
        }

        .strength-medium {
            background-color: #f39c12;
            width: 66%;
        }

        .strength-strong {
            background-color: #2ecc71;
            width: 100%;
        }

        .submit {
            border: none;
            outline: none;
            background: linear-gradient(to right, #3498db, #2ecc71);
            padding: 14px;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(52, 152, 219, 0.2);
        }

        .submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(52, 152, 219, 0.3);
        }

        .submit:active {
            transform: translateY(0);
        }

        .signin {
            text-align: center;
            color: #7f8c8d;
            font-size: 14px;
            margin-top: 10px;
        }

        .signin a {
            color: #3498db;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .signin a:hover {
            color: #2980b9;
            text-decoration: underline;
        }

        .success-message {
            background-color: #d4edda;
            color: #155724;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            text-align: center;
            font-size: 14px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 10px;
            }

            .form {
                padding: 30px 20px;
            }

            .title {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="success-message" id="successMessage">
            注册成功！请检查您的邮箱以完成验证。
        </div>

        <form class="form" id="registerForm">
            <div class="logo">
                <div class="logo-text">华耀城</div>
                <div class="logo-subtext">商家入驻平台</div>
            </div>

            <p class="title">商家注册</p>
            <p class="message">注册成为华耀城商家，开启您的电商之旅</p>

            <div class="form-group">
                <div class="input-container">
                    <label for="name">商家名称</label>
                    <input id="name" name="name" required placeholder="请输入商家名称" type="text" class="input">
                    <div class="error-message" id="nameError">请输入有效的商家名称</div>
                </div>

                <div class="input-container">
                    <label for="phone_number">联系电话</label>
                    <input id="phone_number" name="phone_number" required placeholder="请输入手机号码" type="tel"
                        class="input">
                    <div class="error-message" id="phoneError">请输入有效的手机号码</div>
                </div>

                <div class="input-container">
                    <label for="email">电子邮箱</label>
                    <input id="email" name="email" required placeholder="请输入邮箱地址" type="email" class="input">
                    <div class="error-message" id="emailError">请输入有效的邮箱地址</div>
                </div>

                <div class="input-container">
                    <label for="password">登录密码</label>
                    <input id="password" name="password" required placeholder="请设置登录密码" type="password" class="input">
                    <div class="password-strength">
                        <div class="strength-bar" id="passwordStrength"></div>
                    </div>
                    <div class="error-message" id="passwordError">密码需至少8位，包含字母和数字</div>
                </div>

                <div class="input-container">
                    <label for="password_confirm">确认密码</label>
                    <input id="password_confirm" name="password_confirm" required placeholder="请再次输入密码" type="password"
                        class="input">
                    <div class="error-message" id="confirmError">两次输入的密码不一致</div>
                </div>
            </div>

            <button type="submit" class="submit" ">立即注册</button>

            <p class=" signin">已有商家账号？<a href="./sj.html">立即登录</a></p>
        </form>
    </div>

    <script type="module">
        import url1 from '../peizhi/config.js';
        const form = document.getElementById('registerForm');
        const successMessage = document.getElementById('successMessage');
        const passwordInput = document.getElementById('password');
        const passwordStrength = document.getElementById('passwordStrength');
        const passwordConfirmInput = document.getElementById('password_confirm');

        // 密码强度检测
        passwordInput.addEventListener('input', function () {
            const password = this.value;
            let strength = 0;

            if (password.length >= 8) strength++;
            if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength++;
            if (/\d/.test(password)) strength++;
            if (/[^a-zA-Z\d]/.test(password)) strength++;

            // 重置样式
            passwordStrength.className = 'strength-bar';

            // 根据强度设置样式
            if (password.length > 0) {
                if (strength < 2) {
                    passwordStrength.classList.add('strength-weak');
                } else if (strength < 4) {
                    passwordStrength.classList.add('strength-medium');
                } else {
                    passwordStrength.classList.add('strength-strong');
                }
            }
        });

        // 密码确认验证
        passwordConfirmInput.addEventListener('input', function () {
            const password = passwordInput.value;
            const confirmPassword = this.value;

            if (confirmPassword && password !== confirmPassword) {
                this.classList.add('input-error');
                document.getElementById('confirmError').style.display = 'block';
            } else {
                this.classList.remove('input-error');
                document.getElementById('confirmError').style.display = 'none';
            }
        });

        // 表单提交
        form.addEventListener('submit', function (e) {
            e.preventDefault();
            let isValid = true;

            // 简单的前端验证
            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone_number').value;
            const email = document.getElementById('email').value;
            const password = passwordInput.value;
            const confirmPassword = passwordConfirmInput.value;

            // 重置错误状态
            document.querySelectorAll('.error-message').forEach(el => el.style.display = 'none');
            document.querySelectorAll('.input').forEach(el => el.classList.remove('input-error'));

            // 名称验证
            if (name.length < 2) {
                document.getElementById('nameError').style.display = 'block';
                document.getElementById('name').classList.add('input-error');
                isValid = false;
            }

            // 手机号验证
            const phoneRegex = /^1[3-9]\d{9}$/;
            if (!phoneRegex.test(phone)) {
                document.getElementById('phoneError').style.display = 'block';
                document.getElementById('phone_number').classList.add('input-error');
                isValid = false;
            }

            // 邮箱验证
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                document.getElementById('emailError').style.display = 'block';
                document.getElementById('email').classList.add('input-error');
                isValid = false;
            }

            // 密码验证
            // if (password.length < 8 || !/\d/.test(password) || !/[a-zA-Z]/.test(password)) {
            //     document.getElementById('passwordError').style.display = 'block';
            //     passwordInput.classList.add('input-error');
            //     isValid = false;
            // }

            // // 密码确认验证
            // if (password !== confirmPassword) {
            //     document.getElementById('confirmError').style.display = 'block';
            //     passwordConfirmInput.classList.add('input-error');
            //     isValid = false;
            // }

            if (!isValid) {
                return;
            }

            const formData = new FormData(form);

            // 显示加载状态
            const submitBtn = form.querySelector('.submit');
            const originalText = submitBtn.textContent;
            submitBtn.textContent = '注册中...';
            submitBtn.disabled = true;
            console.log(formData);

            axios({
                url: `${url1}/api/merchants/register/`,
                method: 'post',
                data: formData,
            }).then(result => {
                console.log(result);
                console.log('商家注册成功');

                // 显示成功消息
                window.location.href = './sj.html'

                // 重置表单
                form.reset();
                passwordStrength.className = 'strength-bar';
                const localtoken = result.data.access;
                console.log(localtoken);
                localStorage.setItem('localtoken', localtoken)

            }).catch(error => {
                console.error('请求错误：', error);

                if (error.response && error.response.data) {
                    console.log('错误原因', error.response.data);

                    // 精准错误提示（核心修改部分）
                    let errorMsg = '';
                    const errorData = error.response.data;

                    // 处理后端返回的字段级错误（如手机号已存在、邮箱已存在）
                    if (errorData.phone_number) {
                        errorMsg += '手机号已被注册；';
                        document.getElementById('phone_number').classList.add('input-error');
                        document.getElementById('phoneError').textContent = errorData.phone_number[0];
                        document.getElementById('phoneError').style.display = 'block';
                    }
                    if (errorData.email) {
                        errorMsg += '邮箱已被注册；';
                        document.getElementById('email').classList.add('input-error');
                        document.getElementById('emailError').textContent = errorData.email[0];
                        document.getElementById('emailError').style.display = 'block';
                    }
                    if (errorData.name) {
                        errorMsg += '商家名称已被占用；';
                        document.getElementById('name').classList.add('input-error');
                        document.getElementById('nameError').textContent = errorData.name[0];
                        document.getElementById('nameError').style.display = 'block';
                    }
                    if (errorData.password) {
                        errorMsg += '密码不符合要求；';
                        document.getElementById('password').classList.add('input-error');
                        document.getElementById('passwordError').textContent = errorData.password[0];
                        document.getElementById('passwordError').style.display = 'block';
                    }

                    // 通用错误（无字段级错误时）
                    if (!errorMsg) {
                        errorMsg = typeof errorData === 'object'
                            ? Object.values(errorData).flat().join('；')
                            : errorData;
                    }

                    // 显示错误提示（优先字段内提示，补充全局alert）
                    if (errorMsg) {
                        alert('注册失败：' + errorMsg.replace(/；$|;$/, ''));
                    }

                } else {
                    alert('网络错误，请检查连接后重试');
                }

            }).finally(() => {
                // 恢复按钮状态
                submitBtn.textContent = originalText;
                submitBtn.disabled = false;
            });
        });
    </script>
</body>

</html>
