<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>华耀城用户注册</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        /* 样式部分保持不变，省略重复代码 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
        }

        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4edf5 100%);
        }

        .container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }

        .form {
            display: flex;
            flex-direction: column;
            gap: 20px;
            background-color: #fff;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .form:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);
        }

        .logo {
            text-align: center;
            margin-bottom: 10px;
        }

        .logo-text {
            font-size: 28px;
            font-weight: 700;
            color: #2c3e50;
            letter-spacing: 1px;
        }

        .logo-subtext {
            font-size: 14px;
            color: #7f8c8d;
            margin-top: 5px;
        }

        .title {
            font-size: 24px;
            color: #3498db;
            font-weight: 600;
            text-align: center;
            margin-bottom: 5px;
            position: relative;
            padding-bottom: 10px;
        }

        .title::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 3px;
            background: linear-gradient(to right, #3498db, #2ecc71);
            border-radius: 2px;
        }

        .message {
            color: #7f8c8d;
            font-size: 14px;
            text-align: center;
            line-height: 1.5;
            margin-bottom: 10px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .input-container {
            position: relative;
            margin-bottom: 5px;
        }

        .input-container label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #2c3e50;
            font-size: 14px;
        }

        .input {
            width: 100%;
            padding: 14px 16px;
            outline: none;
            border: 1.5px solid #e1e8ed;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s ease;
            background-color: #fafbfc;
        }

        .input:focus {
            border-color: #3498db;
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
        }

        .input-error {
            border-color: #e74c3c;
        }

        .error-message {
            color: #e74c3c;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }

        .password-strength {
            height: 4px;
            border-radius: 2px;
            margin-top: 8px;
            background-color: #ecf0f1;
            overflow: hidden;
        }

        .strength-bar {
            height: 100%;
            width: 0%;
            transition: width 0.3s ease, background-color 0.3s ease;
        }

        .strength-weak {
            background-color: #e74c3c;
            width: 33%;
        }

        .strength-medium {
            background-color: #f39c12;
            width: 66%;
        }

        .strength-strong {
            background-color: #2ecc71;
            width: 100%;
        }

        .submit {
            border: none;
            outline: none;
            background: linear-gradient(to right, #3498db, #2ecc71);
            padding: 14px;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(52, 152, 219, 0.2);
        }

        .submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(52, 152, 219, 0.3);
        }

        .submit:active {
            transform: translateY(0);
        }

        .signin {
            text-align: center;
            color: #7f8c8d;
            font-size: 14px;
            margin-top: 10px;
        }

        .signin a {
            color: #3498db;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .signin a:hover {
            color: #2980b9;
            text-decoration: underline;
        }

        .success-message {
            background-color: #d4edda;
            color: #155724;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            text-align: center;
            font-size: 14px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 10px;
            }

            .form {
                padding: 30px 20px;
            }

            .title {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <form class="form" id="registerForm">
            <div class="logo">
                <div class="logo-text">华耀城</div>
            </div>
            <p class="title">用户注册</p>
            <div class="form-group">
                <div class="input-container">
                    <label for="username">用户名称</label>
                    <input id="username" name="username" required placeholder="请输入名称" type="text" class="input" />
                    <div class="error-message" id="usernameError">用户名不能为空</div>
                </div>

                <div class="input-container">
                    <label for="phone_number">联系电话</label>
                    <input id="phone_number" name="phone_number" required placeholder="请输入手机号码" type="tel"
                        class="input" />
                    <div class="error-message" id="phoneError">
                        请输入有效的手机号码
                    </div>
                </div>

                <div class="input-container">
                    <label for="email">电子邮箱</label>
                    <input id="email" name="email" required placeholder="请输入邮箱地址" type="email" class="input" />
                    <div class="error-message" id="emailError">
                        请输入有效的邮箱地址
                    </div>
                </div>

                <div class="input-container">
                    <label for="password">登录密码</label>
                    <input id="password" name="password" required placeholder="请设置登录密码" type="password" class="input" />
                    <div class="password-strength">
                        <div class="strength-bar" id="passwordStrength"></div>
                    </div>
                    <div class="error-message" id="passwordError">
                        密码需至少8位，包含字母和数字
                    </div>
                </div>

                <div class="input-container">
                    <label for="password_confirm">确认密码</label>
                    <input id="password_confirm" name="password_confirm" required placeholder="请再次输入密码" type="password"
                        class="input" />
                    <div class="error-message" id="confirmError">
                        两次输入的密码不一致
                    </div>
                </div>
            </div>

            <button type="submit" class="submit">立即注册</button>

            <p class="signin">已有账号？<a href="./yh.html">立即登录</a></p>
        </form>
    </div>

    <script type="module">
        // 1. 获取DOM元素
        const registerForm = document.getElementById("registerForm");
        const username = document.getElementById("username");
        const phone_number = document.getElementById("phone_number");
        const email = document.getElementById("email");
        const password = document.getElementById("password");
        const password_confirm = document.getElementById("password_confirm");
        const passwordStrength = document.getElementById("passwordStrength");
        import url1 from "../peizhi/config.js";

        // 3. 密码强度检测
        password.addEventListener("input", function () {
            const pwd = this.value;
            let strength = 0;

            if (pwd.length >= 8) strength++;
            if (pwd.match(/[a-zA-Z]/) && pwd.match(/[0-9]/)) strength++;
            if (pwd.match(/[!@#$%^&*(),.?":{}|<>]/)) strength++;

            // 更新强度条
            passwordStrength.className = "strength-bar";
            if (strength === 1) passwordStrength.classList.add("strength-weak");
            else if (strength === 2)
                passwordStrength.classList.add("strength-medium");
            else if (strength >= 3)
                passwordStrength.classList.add("strength-strong");
        });

        // 4. 表单验证函数
        function validateForm() {
            let isValid = true;
            const phoneReg = /^1[3-9]\d{9}$/; // 手机号正则
            const emailReg = /^[^\s@]+@[^\s@]+\.[^\s@]+$/; // 邮箱正则
            const pwdReg = /^(?=.*[a-zA-Z])(?=.*\d).{8,}$/; // 密码正则（8位+字母+数字）

            // 验证用户名
            if (!username.value.trim()) {
                showError(username, "usernameError", "用户名不能为空");
                isValid = false;
            } else {
                hideError(username, "usernameError");
            }

            // 验证手机号
            if (!phoneReg.test(phone_number.value.trim())) {
                showError(phone_number, "phoneError", "请输入有效的手机号码");
                isValid = false;
            } else {
                hideError(phone_number, "phoneError");
            }

            // 验证邮箱
            if (!emailReg.test(email.value.trim())) {
                showError(email, "emailError", "请输入有效的邮箱地址");
                isValid = false;
            } else {
                hideError(email, "emailError");
            }

            // 验证密码
            // if (!pwdReg.test(password.value)) {
            //     showError(password, 'passwordError', '密码需至少8位，包含字母和数字');
            //     isValid = false;
            // } else {
            //     hideError(password, 'passwordError');
            // }

            // 验证确认密码
            if (password.value !== password_confirm.value) {
                showError(password_confirm, "confirmError", "两次输入的密码不一致");
                isValid = false;
            } else {
                hideError(password_confirm, "confirmError");
            }

            return isValid;
        }

        // 错误提示显示函数
        function showError(input, errorId, message) {
            input.classList.add("input-error");
            const errorElem = document.getElementById(errorId);
            errorElem.textContent = message;
            errorElem.style.display = "block";
        }

        // 错误提示隐藏函数
        function hideError(input, errorId) {
            input.classList.remove("input-error");
            const errorElem = document.getElementById(errorId);
            errorElem.style.display = "none";
        }

        // 5. 监听表单提交事件
        registerForm.addEventListener("submit", async function (e) {
            e.preventDefault(); // 阻止表单默认提交（刷新页面）

            // 先执行前端验证
            if (!validateForm()) return;

            // 构造请求数据
            const formData = {
                username: username.value.trim(),
                phone_number: phone_number.value.trim(),
                email: email.value.trim(),
                password: password.value,
                password_confirm: password_confirm.value,
            };

            try {
                // 发送注册请求（注意：method 小写，不是 type）
                const response = await axios({
                    url: `${url1}/api/users/register/`,
                    method: "post", // 正确的请求方式
                    data: formData,
                    headers: {
                        "Content-Type": "application/json", // 若后端需要JSON格式
                    },
                });

                // 注册成功（根据后端返回状态判断，这里假设200为成功）
                if (response.status === 200 || response.status === 201) {
                    alert("注册成功！即将跳转到登录页");
                    window.location.href = "./yh.html"; // 跳转到登录页
                }
            } catch (error) {
                // 错误处理（核心修改：强制全部中文提示，不依赖后端返回文字）
                console.error("注册失败：", error);

                // 先重置所有后端错误状态
                hideError(username, "usernameError");
                hideError(phone_number, "phoneError");
                hideError(email, "emailError");
                hideError(password, "passwordError");
                hideError(password_confirm, "confirmError");

                if (error.response && error.response.data) {
                    const errorData = error.response.data;
                    let globalError = "";

                    // 字段级错误：直接显示中文，忽略后端英文提示
                    if (errorData.username) {
                        const msg = "用户名已被占用";
                        showError(username, "usernameError", msg);
                        globalError += msg + "；";
                    }
                    if (errorData.phone_number) {
                        const msg = "手机号已被注册";
                        showError(phone_number, "phoneError", msg);
                        globalError += msg + "；";
                    }
                    if (errorData.email) {
                        const msg = "邮箱已被注册";
                        showError(email, "emailError", msg);
                        globalError += msg + "；";
                    }
                    if (errorData.password) {
                        // 密码相关错误统一中文提示
                        let msg = "密码不符合要求";
                        // 可根据后端常见密码错误补充更精准的中文
                        const pwdError = errorData.password[0] || "";
                        if (pwdError.toLowerCase().includes("too common"))
                            msg = "密码过于常见";
                        if (pwdError.toLowerCase().includes("too short"))
                            msg = "密码长度不足（至少8位）";
                        if (pwdError.toLowerCase().includes("numeric"))
                            msg = "密码不能全为数字";
                        showError(password, "passwordError", msg);
                        globalError += msg + "；";
                    }
                    if (errorData.password_confirm) {
                        const msg = "两次输入的密码不一致";
                        showError(password_confirm, "confirmError", msg);
                        globalError += msg + "；";
                    }

                    // 无字段级错误时，显示通用中文错误
                    if (!globalError) {
                        globalError = "注册失败，请检查信息后重试";
                        // 若后端有其他错误，也转为中文
                        const allErrors = Object.values(errorData).flat().join("");
                        if (allErrors.toLowerCase().includes("already exists")) {
                            globalError = "该账号已存在，请直接登录";
                        }
                    }

                    // 弹出全局中文错误提示
                    alert("注册失败：" + globalError.replace(/；$|;$/, ""));
                } else {
                    alert("网络错误，请检查网络连接后重试");
                }
            }
        });
    </script>
</body>

</html>
