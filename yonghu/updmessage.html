<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人资料页面</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        /* 保留之前的优化样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-size: 25px;
            font-family: "Microsoft YaHei", "Heiti SC", sans-serif;
        }

        body {
            background-color: #f5f5f5;
            padding: 40px 0;
        }

        .box {
            width: 800px;
            background-color: #ffffff;
            height: auto;
            margin: 0 auto;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            padding: 40px;
        }

        .top {
            font-weight: 700;
            font-size: 32px;
            color: #2d3748;
            margin-bottom: 36px;
            padding-bottom: 16px;
            border-bottom: 2px solid #f0f0f0;
        }

        .div1 {
            display: flex;
            align-items: center;
            padding: 22px 20px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            /* 点击光标 */
            transition: background-color 0.3s ease;
        }

        .div1:last-child {
            border-bottom: none;
        }

        .div1:hover {
            background-color: #f8f9fa;
        }

        .div1_left {
            width: 180px;
            color: #4a5568;
            font-weight: 500;
        }

        .div1_right {
            margin-left: auto;
            margin-right: 10px;
            color: #2d3748;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .img_toux {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #e8f4f8;
        }

        /* 核心：容器显示/隐藏控制 */
        .profile-list {
            /* 原列表容器 - 默认显示 */
            display: block;
        }

        .field-detail {
            /* 总详情容器 - 默认隐藏 */
            display: none;
        }

        .detail-panel {
            /* 单个字段的详情面板 - 全部默认隐藏 */
            display: none;
        }

        /* 详情面板通用样式 */
        .back-btn {
            margin-bottom: 30px;
            padding: 10px 20px;
            background-color: #4299e1;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .back-btn:hover {
            background-color: #3182ce;
        }

        .input-field {
            width: 100%;
            padding: 15px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            margin-top: 10px;
            font-size: 22px;
            outline: none;
        }

        .input-field:focus {
            border-color: #4299e1;
            box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.1);
        }

        .avatar-upload {
            border: 2px dashed #e0e0e0;
            padding: 40px;
            text-align: center;
            border-radius: 12px;
            margin-bottom: 30px;
        }

        .save-btn {
            padding: 12px 30px;
            background-color: #4299e1;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .save-btn:hover {
            background-color: #3182ce;
        }

        .tip-text {
            font-size: 20px;
            color: #666;
            margin-top: 15px;
            margin-bottom: 20px;
        }

        /* 响应式适配 */
        @media (max-width: 850px) {
            .box {
                width: 90%;
                padding: 30px 20px;
            }

            .top {
                font-size: 28px;
                margin-bottom: 28px;
            }

            .div1_left {
                width: 140px;
                font-size: 22px;
            }

            .div1_right {
                font-size: 22px;
            }

            .img_toux {
                width: 36px;
                height: 36px;
            }

            .input-field,
            .save-btn,
            .tip-text {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>
    <div class="box">
        <!-- 1. 原列表容器（默认显示） -->
        <div class="profile-list">
            <div class="top">个人资料</div>
            <div class="div1" data-target="avatar-panel">
                <div class="div1_left">头像</div>
                <div class="div1_right">
                    <img class="img_toux" src="../img/个人信息.png" alt="个人头像">
                    <span>222</span>
                </div>
            </div>
            <div class="div1" data-target="name-panel">
                <div class="div1_left">名字</div>
                <div class="div1_right">具体后续给的名字</div>
            </div>
            <div class="div1" data-target="email-panel">
                <div class="div1_left">邮箱</div>
                <div class="div1_right">具体后续给的名字</div>
            </div>
            <div class="div1" data-target="phone-panel">
                <div class="div1_left">电话</div>
                <div class="div1_right">具体后续给的名字</div>
            </div>
            <div class="div1" data-target="createTime-panel">
                <div class="div1_left">账号创建时间</div>
                <div class="div1_right">具体后续给的名字</div>
            </div>
        </div>

        <!-- 2. 详情容器（默认隐藏） -->
        <div class="field-detail">
            <button class="back-btn" id="backBtn">返回列表</button>

            <!-- 2.2 名字详情面板（静态HTML） -->
            <div class="detail-panel" id="name-panel">
                <div class="top">修改您的名字</div>
                <div class="content">
                    <input type="text" class="input-field" id="chage_name" value="具体后续给的名字">
                    <button class="save-btn">保存名字</button>
                </div>
            </div>

            <!-- 2.3 邮箱详情面板（静态HTML） -->
            <div class="detail-panel" id="email-panel">
                <div class="top">编辑邮箱</div>
                <div class="content">
                    <input type="email" class="input-field" id="chage_email" value="具体后续给的名字">
                    <p class="tip-text">邮箱用于</p>
                    <button class="save-btn">保存邮箱</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import url1 from './peizhi/config.js';
        const token = localStorage.getItem('token');

        // 核心元素获取
        const profileList = document.querySelector('.profile-list');
        const fieldDetail = document.querySelector('.field-detail');
        const backBtn = document.getElementById('backBtn');
        const allDetailPanels = document.querySelectorAll('.detail-panel'); // 所有详情面板

        // 1. 点击列表行 → 显示对应详情面板
        document.querySelectorAll('.div1').forEach(item => {
            item.addEventListener('click', () => {
                // 获取目标面板ID（通过 data-target 属性关联）
                const targetPanelId = item.dataset.target;
                const targetPanel = document.getElementById(targetPanelId);

                // 隐藏列表，显示总详情容器
                profileList.style.display = 'none';
                fieldDetail.style.display = 'block';

                // 隐藏所有详情面板，只显示目标面板
                allDetailPanels.forEach(panel => {
                    panel.style.display = 'none';
                });
                targetPanel.style.display = 'block';
            });
        });

        // 2. 点击返回按钮 → 回到列表
        backBtn.addEventListener('click', () => {
            // 隐藏总详情容器，显示列表
            fieldDetail.style.display = 'none';
            profileList.style.display = 'block';

            // （可选）隐藏所有详情面板，避免下次打开时残留
            allDetailPanels.forEach(panel => {
                panel.style.display = 'none';
            });
        });

        // （可选）给所有保存按钮添加点击事件（后续对接接口用）
        document.querySelectorAll('.save-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                // 这里可以添加 axios 保存请求逻辑
                alert('保存成功！'); // 临时提示，后续替换为真实接口请求
                // 保存后可选择留在当前面板或返回列表
                // fieldDetail.style.display = 'none';
                // profileList.style.display = 'block';
            });
        });
    </script>
</body>

</html>
